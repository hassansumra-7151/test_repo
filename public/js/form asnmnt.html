   }
	#bg{

	<div id="main">

 <script src="../js/jquery.js"></script>
		<script>

					// document.write("<h1>"+name+"<br><br>"+lname +"<br><br>"+phone+"<br><br>" +email +"</h1> ");

				});
			
			});
