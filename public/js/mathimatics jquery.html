<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<title>assignment jquery</title>
	<link rel="stylesheet" href="../css/bootstrap.css">
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

</head>
<script>
	function btn(){
		
		var n1= parseInt(document.getElementById('n1').value);
		var n2= parseInt(document.getElementById('n2').value);
		var aply=document.getElementById('operators').value;

		if(aply === '+'){
			document.getElementById('result').value=n1+n2;
		}
		if(aply === '-'){
			document.getElementById('result').value=n1-n2;
		}
		if(aply === 'x'){
			document.getElementById('result').value=n1*n2;
		}
		if(aply === '/'){
			document.getElementById('result').value=n1/n2;
		}
	}
		
</script>
<body id="main">
	<style>
		#main{
			background:#FFFFCC ;

		}
		#head{
			color:red;
			padding-left: 15px;
			padding-bottom: 30px;
			padding-top: 30px;
			
		}
		#n1{
			border:1px solid #FF9966;
			border-radius: 15px;
			padding-top: 3px;
			padding-bottom: 3px;
			padding-left: 10px;
			margin-left: 15px;
			width:300px;
		}
		#n2{
			border:1px solid #FF9966;
			border-radius: 15px;
			padding-top: 3px;
			padding-bottom: 3px;
			padding-left: 10px;
			margin-left: 15px;
			width:300px;
		}
		#btn{
			border:1px solid #FF9966;
            border-radius: 15px;
            padding-bottom:5px;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 5px;
            margin-left: 15px;


		}
		#result{
			border:1px solid #FF9966;
			border-radius: 15px;
			padding-top: 4px;
			padding-bottom: 4px;
			padding-left: 10px;
			margin-left: 15px;
			width:300px;
		}
		#operators{
			margin-left: 20px;
			border:1px solid #FF9966;
            border-radius: 15px;
            padding-bottom:3px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 3px;
           
		}
	</style>
	<h2 id="head">Arithmetic Function:</h2>
	<input type="text" name="" id="n1"/>
	<br><br>
	<input type="text" name="" id="n2"/>
	<br><br>
	<select id="operators">
		<option value="+">+</option>
		<option value="-">-</option>
		<option value="x">x</option>
		<option value="/">/</option>
	</select>
	<button onclick="btn();" id="btn">=</button>
	<br><br>
	<input type="text" name="" id="result"/>
	
	
	

</body>
</html>
