<!DOCTYPE html>
<html>
<head>
	<title>append method</title>
</head>
<body>
	<style>
		#main{
			background: lightgreen;
			width: 400px;
			border: 2px solid black;
		}
		#list{
			background: pink;
			width:200px;
			border:2px solid black;
		    padding-top: 15px;
		    padding-bottom: 15px;
		}
	</style>
	<center>
	<div id="main">
		<h2>Start</h2>
		<p>this is the first peragraph of my assignment</p>
     </div>
 
	<br>
	<button id="after">after</button>
	<button id="before">before</button>
	</center>
	<script src="../js/jquery.js"></script>
		<script>
			$(document).ready(function(){
				$('#after').click(function(){
					$(".main").after("<h2>Friends<h2>");

				});
				$('#before').click(function(){
					$("#main").before("<h2>Dear<h2>");

				});

			});
		</script>

</body>
</html>
