<!DOCTYPE html>
<html>
<head>
	<title>append method</title>
</head>
<body>
	<style>
		#main{
			background: lightgreen;
			width: 400px;
			
			border-radius:10px;
			border: 2px solid black;
			padding: 40px;
			margin-bottom: 10px;
		}
		#list{
			background: pink;
			width:200px;
			border:2px solid black;
		    padding-top: 15px;
		    padding-bottom: 15px;
		}
	</style>
	<center>
	<div id="main">
		<h1>Start</h1>
		<p>this is the first peragraph of my assignment this is the first peragraph of my assignmentthis is the first peragraph of my assignmentthis is the first peragraph of my assignmentvvvthis is the first peragraph of myt</p>
    </div>
	<button id="slideup">slideup</button>
	<button id="slidedown">slidedown</button>
	<button id="slidetoggle">slidetoggle</button>
	</center>
	<script src="../js/jquery.js"></script>
		<script>
			$(document).ready(function(){
				$('#slideup').click(function(){
				$('#main').slideUp(2000);

				});
				$('#slidedown').click(function(){
				$('#main').slideDown('slow');

				});
				$('#slidetoggle').click(function(){
				$('#main').slideToggle('fast');

				});


			});
		</script>

</body>
</html>
