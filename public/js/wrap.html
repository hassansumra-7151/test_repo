<!DOCTYPE html>
<html>
<head>
	<title>append method</title>
</head>
<body>
	<style>
		#main{
			background: lightgreen;
			width: 400px;
			border: 2px solid black;
		}
		#list{
			background: pink;
			width:200px;
			border:2px solid black;
		    padding-top: 15px;
		    padding-bottom: 15px;
		}
		#next{
			background: pink;
			width:400px;
			border:2px solid black;
		    padding-top: 15px;
		    padding-bottom: 15px;
		}
	</style>
	<center>
	<div id="main">
		<h2>Start</h2>
		<p>this is the first peragraph of my assignment this is the first peragraph of my assignmentthis is the first peragraph of my assignmentthis is the first peragraph of my assignment</p>
		

	</div>
	<br>
	<button id="wrap">wrap</button>
	<button id="unwrap">unwrap</button>
	<script src="../js/jquery.js"></script>
		<script>
			$(document).ready(function(){

				$('#wrap').click(function(){
					$('#main p').wrap('<h2></h2>')
				});

					$('#unwrap').click(function(){
					$('#main p').unwrap();
				});

			});

             
			
		</script>
	</body>
</html>
