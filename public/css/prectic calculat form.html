<!DOCTYPE html>
<html>
<head>
	 <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <title>Append Function</title>
     <link rel="stylesheet" href="../css/bootstrap.css">
     <link rel="stylesheet" href="prec1.css">
</head>
<body id="length">

	<h5 id="head">Add Invoice</h5>
   <!--div class="container" id="main"-->
   <div id="div">
	<table border="1" cellspacing="0" id="table">
	  <tr style="text-align: center;">
		<th>Sr.No</th>
		<th>Product</th>
		<th>Qty</th>
		<th>Price</th>
		<th>Itom</th>
		<th>Total</th>
		<th>Action</th>
	</tr>
	<tr>
		<td style="text-align: center;">1</td>
	 <td>
	<select id="select">
	    <option>--Select--</option>
	    <option>Clothes</option>
	    <option>Shose</option>
	    <option>Jewellery</option>
	    <option>Bages</option>
	</select>
	</td>
	   <td>
		 <input type="text" class="qty" name="Qty" value="" onchange="multiply();">
	   </td>
	   <td>
			<input type="text" class="rate" name="rate" value="" onchange="multiply();">
	   </td>
	   <td>
			<input type="text" class="itom" name="itom" value="" onchange="multiply();">
	   </td>
		<td><input type="text"class="total" name="" disabled=""></td>
	   <td>
			<button id="btn" class="btn btn-primary">Add</button>
	   </td>
    </tr>
    </div>

    <tbody >
    	
    </tbody>
   </table>
    <div>
    	<label style="font-size:15px; padding-left: 52px;">Total</label>
    	<br>
    	<input type="text" id="Ftotal" name="Ftotal" class="Ftotal" disabled="">
    	<button id="btn2" class="btn btn-primary">Save</button>
    </div>

	<!--/div-->
	<script src="../js/jquery.js"></script>
		<script>
			$(document).ready(function(){
				$('#btn').click(function(){
					var length = $('tbody tr').length;
                $('#table').append('<tr><td style="text-align: center;">'+length+'</td><td><select id="select"><option>--Select--</option><option>Clothes</option><option>Shose</option><option>Jewellery</option><option>Bages</option></select></td><td><input type="text" class="qty" name="Qty" value="" onchange="multiply();"></td><td><input type="text" class="rate" name="rate" value="" onchange="multiply();"></td><td><input type="text" class="itom" name="itom" value="" onchange="multiply();"></td><td><input type="text"class="total" name="" disabled=""></td><td><button id="remove" class="btn btn-danger">Remove</button></td></tr>')
		});

				$('tbody').on('click' , '#remove' ,function(){
					$(this).closest('tr').remove();
				});
        	});


        </script>
        <script>
        	function multiply(element = null){
			 	if (element == null) {
			 		return false
			 	}
            	var Qty= element.find('.qty').val();
        	  	var rate = element.find('.rate').val();
        	  	var itom = element.find('.itom').val();
        	  	var total = parseFloat(Qty)*parseFloat(rate)*parseFloat(itom);
        	  	element.find('.total, .Ftotal').val(total);
        	

        	  	

            };

           

                
                $('body').on('keyup','.qty',function(){
            	var parent = $(this).closest('tr');
            	multiply(parent);
            });
                $('body').on('keyup','.rate',function(){
             	var parent = $(this).closest('tr');
            	multiply(parent);
            });
           
                 $('body').on('keyup','.Ftotal',function(){
                var parent = $(this).closest('tr');
             	multiply(parent);
             });

                  $('body').on('keyup','.itom',function(){
                 var parent = $(this).closest('tr');
             	multiply(parent);
             });
                  
           
           

		</script>
		
        <script>
            $('.qty, .rate, .Ftotal,.total').keyup(function(){
            var rate = parseFloat($('.qty').val()) || 0;
            var box = parseFloat($('.rate').val()) || 0;
             var itom = parseFloat($('.rate').val()) || 0;
         

            $('.Ftotal').val(rate * box *itom);    
        });


        </script>
        
	       
        
</body>
</html>
